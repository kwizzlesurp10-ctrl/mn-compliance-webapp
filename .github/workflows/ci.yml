name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mn-compliance-webapp/package-lock.json

      - name: Install dependencies
        working-directory: mn-compliance-webapp
        run: npm ci

      - name: Lint
        working-directory: mn-compliance-webapp
        run: npm run lint

      - name: Type check
        working-directory: mn-compliance-webapp
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: mn-compliance-webapp
        run: npm test

      - name: Build
        working-directory: mn-compliance-webapp
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
