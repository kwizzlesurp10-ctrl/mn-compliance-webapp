name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        working-directory: webapp
        run: npm ci

      - name: Lint
        working-directory: webapp
        run: npx eslint .

      - name: Type check
        working-directory: webapp
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: webapp
        run: npm test

      - name: Build
        working-directory: webapp
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
